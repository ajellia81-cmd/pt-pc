name: Rendering API dialog preview

on:
  push:
    branches: [feature/windows-spatial-atmos]
    paths:
      - tools/rendering_api_dialog_preview.cpp
      - .github/workflows/rendering-api-dialog-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build dialog preview
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cl /nologo /std:c++20 /utf-8 /O2 /EHsc tools\rendering_api_dialog_preview.cpp /link /SUBSYSTEM:WINDOWS /OUT:rendering-api-dialog-preview.exe user32.lib gdi32.lib
      - name: Upload dialog preview
        uses: actions/upload-artifact@v4
        with:
          name: rendering-api-dialog-preview
          path: rendering-api-dialog-preview.exe
