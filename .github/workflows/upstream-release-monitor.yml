name: Upstream release monitor

on:
  schedule:
    # 09:17 Korea Standard Time, every day.
    - cron: '17 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Detect a new upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: LoreanXavier/pt-pc
          # Update this only after a new upstream base has been ported and built.
          CURRENT_PORT_BASELINE: v1.0.7
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name')"
          if [ "${tag}" = "${CURRENT_PORT_BASELINE}" ]; then
            echo "Upstream ${tag} matches the current Korean + Atmos baseline."
            exit 0
          fi
          echo "::error::Upstream ${tag} is newer than the prepared baseline ${CURRENT_PORT_BASELINE}. Start a fresh Korean + Atmos port from ${tag}."
          exit 1
