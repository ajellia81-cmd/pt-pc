name: Upstream release monitor

on:
  schedule:
    # 09:17 Korea Standard Time, every day.
    - cron: '17 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Detect a new upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: LoreanXavier/pt-pc
          TARGET: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name')"
          title="Upstream ${tag} detected — prepare Korean + Atmos rebuild"
          existing="$(gh issue list --repo "${TARGET}" --state all --search "\"${title}\" in:title" --json number --jq 'length')"
          if [ "${existing}" -gt 0 ]; then
            echo "Upstream ${tag} was already recorded."
            exit 0
          fi
          body="The upstream project released ${tag}. Create a new branch from this exact upstream tag; do not modify the previous custom build. Reapply Korean localization and Dolby Atmos as an additive layer, then run the Windows preservation/build checks before publishing an artifact."
          gh issue create --repo "${TARGET}" --title "${title}" --body "${body}"
