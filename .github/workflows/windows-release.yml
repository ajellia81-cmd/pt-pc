name: Windows x64 Release

on:
  push:
    branches: [main, feature/windows-spatial-atmos]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK and build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install vulkan-sdk --no-progress -y
            if ($LASTEXITCODE -eq 0 -and (Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName 'Bin\glslc.exe') })) {
              $installed = $true
              break
            }
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not $installed) { throw 'Vulkan SDK installation did not provide glslc.exe' }
          choco install ninja --no-progress -y

      - name: Bundle Noto Sans KR
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/google/fonts/e9678a5385322c63730122ba464765baad83cfd8/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' -OutFile 'assets/fonts/NotoSansKR.ttf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/google/fonts/e9678a5385322c63730122ba464765baad83cfd8/ofl/notosanskr/OFL.txt' -OutFile 'assets/fonts/OFL-NotoSansKR.txt'
          if ((Get-Item 'assets/fonts/NotoSansKR.ttf').Length -lt 10000000) { throw 'Noto Sans KR download is incomplete' }

      - name: Configure and build x64 Release
        shell: pwsh
        run: |
          # The 1.0.5 source archive has no SPIR-V-to-HLSL helper, so it
          # cannot produce the DXIL files required by the optional full D3D12
          # renderer.  Keep that unavailable renderer out of this portable
          # build instead of publishing an executable that advertises it but
          # cannot start it.  The normal Vulkan renderer and D3D12-present
          # path used by frame generation remain available.
          $env:PT_CMAKE_ARGS = '-DPT_D3D12_GAME=OFF'
          & cmd.exe /c tools\build_pt.bat release 2>&1 | Tee-Object -FilePath windows-build.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            cmake --build build\release --target pt_release 2>&1 | Tee-Object -FilePath windows-build.log -Append
            $code = $LASTEXITCODE
          }
          if ($code -ne 0) {
            Get-Content windows-build.log | Select-String -Pattern '(: error |error C[0-9]+|CMake Error|FAILED:|fatal error)' | ForEach-Object {
              Write-Host "::error::$($_.Line)"
            }
            exit $code
          }

      - name: Run audio and settings checks
        shell: cmd
        run: |
          cmake --build build\release --target pt_audio_channel_layout_test pt_settings_roundtrip_test pt_korean_text_layout_test
          build\release\pt_audio_channel_layout_test.exe
          mkdir build\release\test-output
          build\release\pt_settings_roundtrip_test.exe build\release\test-output
          build\release\pt_korean_text_layout_test.exe

      - name: Verify packaged runtime files
        shell: cmd
        run: |
          for %%F in (build\release\pt_release.exe build\release\pt_release.exe.upscalers.json build\release\lisa_date\script.txt build\release\lisa_date\text\eng.txt build\release\lisa_date\text\kor.txt build\release\lisa_date\music.ogg build\release\texture-tools\realesrgan-ncnn-vulkan.exe build\release\pt-updater.exe) do (
            if not exist "%%F" (
              echo Missing packaged runtime file: %%F
              exit /b 1
            )
          )

      - name: Assemble portable runtime
        shell: cmd
        run: |
          if exist artifacts rmdir /s /q artifacts
          python tools\package.py --build build\release --out artifacts --exe build\release\pt_release.exe

      - name: Upload portable runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P.T.PC.Port-windows-x64-Release
          if-no-files-found: error
          path: |
            artifacts/*.zip

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-build.log
