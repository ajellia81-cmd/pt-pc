      - name: Verify Korean text shaping and rasterization
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import shlex
          root = Path('source/build/port-src').resolve()
          headers = list(Path('source').rglob('stb_truetype.h'))
          assert headers, 'stb_truetype.h not found after native build'
          probe = Path('korean-font-probe.cpp')
          probe.write_text("#include \"engine/ui/ffnt.h\"\n#include \"engine/core/localized_text.h\"\n#include \"engine/core/resource_path.h\"\n#include <algorithm>\n#include <filesystem>\n#include <iostream>\n#include <stdexcept>\nnamespace pt { std::filesystem::path ExecutableDir() { return std::filesystem::current_path(); } }\nvoid require(bool value, const std::string& message) { if (!value) throw std::runtime_error(message); }\nint KoreanLayoutAudit();\nint main() {\n require(KoreanLayoutAudit() == 0, \"Korean layout regressions\");\n for (int language=0; language<13; ++language) {\n  const auto label = pt::localized::Menu(\"op_sub_korean\", language);\n  require(!label.empty(), \"missing Korean selector label\");\n  if (language != 0) require(label != \"Korean\", \"untranslated Korean selector label\");\n }\n const auto text = pt::localized::Characters(12);\n require(text.find(\"한국어\") != std::string::npos, \"missing Korean atlas characters\");\n pt::ui::FfntFont font;\n std::string error;\n require(font.LoadUnicodeFont(\"Noto Sans KR\", text, false, &error), \"Korean font: \" + error);\n const auto codes = pt::ui::DecodeUtf8(\"한국어 옵션 자막\");\n for (auto code : codes) require(font.Find(code) != nullptr, \"missing Korean glyph\");\n const auto shaped = font.ShapeLine(codes, 0);\n require(!shaped.empty(), \"Korean shaping produced no glyphs\");\n bool visible=false;\n for (const auto& g : shaped) {\n  require(g.glyph != nullptr, \"shaped glyph absent from Korean atlas\");\n  for (int y=0; y<g.glyph->height; ++y)\n   for (int x=0; x<g.glyph->width; ++x) visible |= font.Coverage(*g.glyph, x, y) != 0;\n }\n require(visible, \"Korean glyphs are blank\");\n std::vector<std::vector<uint8_t>> mips;\n require(font.BuildAtlas(mips, 1, true), \"Korean atlas failed\");\n require(!mips.empty() && std::any_of(mips[0].begin(),mips[0].end(),[](auto p){return p!=0;}), \"Korean atlas is empty\");\n for (const auto& family : {\"Noto Sans KR\", \"Noto Sans\", \"Noto Sans SC\"}) {\n  pt::ui::FfntFont latin;\n  std::string message;\n  const int language = std::string_view(family) == \"Noto Sans KR\" ? 12 : std::string_view(family) == \"Noto Sans SC\" ? 8 : 7;\n  require(latin.LoadUnicodeFont(family, pt::localized::Characters(language), false, &message), std::string(family) + \": \" + message);\n  for (const auto& word : {\"Reflex\", \"Offline\", \"office\", \"afflict\", \"ff\", \"fi\", \"fl\", \"ffi\", \"ffl\"}) {\n   const auto shaped_word = latin.ShapeLine(pt::ui::DecodeUtf8(word), 0);\n   require(!shaped_word.empty(), std::string(word) + \": no shaped glyphs\");\n   for (const auto& glyph : shaped_word) require(glyph.glyph != nullptr, std::string(family) + \": missing ligature in \" + word);\n  }\n }\n std::cout << \"PASS: Reflex and ff/fi/fl/ffi/ffl shaping in KR, Latin and SC fonts\\\\n\";\n pt::ui::FfntFont movie;\n std::string movie_error;\n require(movie.LoadUnicodeFont(\"Noto Sans KR\", text, false, &movie_error, 300, true), \"Korean Light subtitle font: \" + movie_error);\n for (auto code : pt::ui::DecodeUtf8(\"한국어\")) {\n  const auto* g=movie.Find(code);\n  require(g && g->width>=4 && g->height>=4, \"subtitle glyph missing padding\");\n  for (int y=0;y<g->height;++y) for (int x=0;x<g->width;++x)\n   if(x<2 || y<2 || x>=g->width-2 || y>=g->height-2)\n    require(movie.Coverage(*g,x,y)==0, \"subtitle outline rim contains ink\");\n }\n pt::ui::FfntFont medium;\n std::string medium_error;\n require(medium.LoadUnicodeFont(\"Noto Sans KR\", text, false, &medium_error, 500, false), \"Korean Medium menu font: \" + medium_error);\n auto ink = [](const pt::ui::FfntFont& face) {\n  uint64_t sum=0;\n  for (auto code : pt::ui::DecodeUtf8(\"한글자막\")) {\n   const auto* g=face.Find(code);\n   require(g != nullptr, \"weight probe glyph missing\");\n   for(int y=0;y<g->height;++y) for(int x=0;x<g->width;++x) sum += face.Coverage(*g,x,y);\n  }\n  return sum;\n };\n require(ink(medium) > ink(movie), \"Korean Medium and Light weights are not distinct\");\n std::cout << \"PASS: Medium menu and Light subtitles use distinct rasterized weights\\n\";\n std::cout << \"PASS: subtitle outline has a clean 2-pixel transparent rim\\n\";\n std::cout << \"PASS: 13 localized selector labels; Korean font loaded, shaped and rasterized; atlas \"\n           << font.AtlasWidth() << \"x\" << font.AtlasHeight() << \"\\n\";\n}\n")
          layout_test = Path('korean-layout-probe.cpp')
          layout_test.write_text("#include <cstdio>\n\n#include \"engine/core/korean_text.h\"\n#include \"engine/core/localized_text.h\"\n#include \"engine/ui/ffnt.h\"\n#include \"engine/ui/text_layout.h\"\n\nnamespace {\n\nbool Fits(std::string_view text, const pt::ui::TextStyle& style, glm::vec2 size) {\n    const pt::ui::TextLayout layout = pt::ui::LayoutTextInBox(text, style, glm::vec2(0.0f), size, true);\n    constexpr float kTolerance = 0.01f;\n    for (const pt::ui::TextLine& line : layout.lines) {\n        if (line.width > size.x + kTolerance) return false;\n        for (const pt::ui::LaidGlyph& glyph : line.glyphs) {\n            const glm::vec2 end = glyph.position + glyph.size;\n            if (glyph.position.x < -kTolerance || glyph.position.y < -kTolerance || end.x > size.x + kTolerance || end.y > size.y + kTolerance) return false;\n        }\n    }\n    return true;\n}\n\nbool HasAllGlyphs(const pt::ui::FfntFont& font, std::string_view text) {\n    for (uint32_t code : pt::ui::DecodeUtf8(text)) {\n        if (code >= 32 && code != pt::ui::kInlinePicture && !font.Find(code)) return false;\n    }\n    return true;\n}\n\n}\n\nint KoreanLayoutAudit() {\n    pt::ui::FfntFont font, subtitle_font;\n    std::string error;\n    if (!font.LoadUnicodeFont(\"Noto Sans KR\", pt::localized::Characters(12), false, &error, 500)) {\n        std::printf(\"FAIL: Korean font: %s\\n\", error.c_str());\n        return 1;\n    }\n    if (!subtitle_font.LoadUnicodeFont(\"Noto Sans KR\", pt::localized::Characters(12), false, &error, 300, true)) {\n        std::printf(\"FAIL: Korean subtitle font: %s\\n\", error.c_str());\n        return 1;\n    }\n\n    pt::ui::TextStyle pc;\n    pc.font = &font;\n    pc.font_width = pc.font_height = 20.0f;\n    int failures = 0;\n    // Keep newly introduced upstream PC-settings rows from silently falling\n    // back to English when the port is updated.\n    for (const char* key : {\"pc_photo_reset_settings\", \"pc_note_photo_reset_settings\"}) {\n        if (pt::korean::Menu(key).empty()) {\n            std::printf(\"FAIL: missing Korean PC-settings text: %s\\n\", key);\n            ++failures;\n        }\n    }\n    for (const pt::korean::Text& entry : pt::korean::kMenu) {\n        if (!HasAllGlyphs(font, entry.text)) {\n            std::printf(\"FAIL: missing Korean glyphs in %.*s\\n\", int(entry.key.size()), entry.key.data());\n            ++failures;\n        }\n        // The PC settings help area is 1100 by 86 virtual pixels. LayoutTextInBox is the same fit-to-box path the game uses.\n        const bool help = entry.key.starts_with(\"pc_note_\");\n        const glm::vec2 box = help ? glm::vec2(1100.0f, 86.0f) : glm::vec2(300.0f, 30.0f);\n        if (!Fits(entry.text, pc, box)) {\n            std::printf(\"FAIL: Korean text escapes %s box: %.*s\\n\", help ? \"help\" : \"label\", int(entry.key.size()), entry.key.data());\n            ++failures;\n        }\n    }\n\n    pt::ui::TextStyle subtitle;\n    subtitle.font = &subtitle_font;\n    subtitle.font_width = subtitle.font_height = 32.0f;\n    subtitle.text_space = -6.0f;\n    subtitle.line_space = -4.0f;\n    pt::ui::NormalizeSubtitleStyle(subtitle);\n    for (const pt::korean::Subtitle& entry : pt::korean::kSubtitles) for (std::string_view line : entry.lines) {\n        if (!HasAllGlyphs(subtitle_font, line) || !Fits(line, subtitle, glm::vec2(1024.0f, 160.0f))) {\n            std::printf(\"FAIL: Korean subtitle layout: %08x\\n\", entry.key);\n            ++failures;\n        }\n    }\n\n    // Latin product names and credits can use every standard ligature in the\n    // bundled Noto Sans KR face.  Every resulting shaped glyph must exist in\n    // the Korean atlas, rather than only the individual ASCII characters.\n    for (const auto& face : {&font, &subtitle_font}) {\n        for (const char* text : {\"NVIDIA Reflex\", \"Coffee with Lisa\", \"first\", \"office\", \"affluent\"}) {\n            for (const pt::ui::ShapedGlyph& glyph : face->ShapeLine(pt::ui::DecodeUtf8(text), 0.0f)) {\n                if (!glyph.glyph) {\n                    std::printf(\"FAIL: Korean ligature missing in %s\\n\", text);\n                    ++failures;\n                    break;\n                }\n            }\n        }\n    }\n\n    std::printf(\"Korean layout: %zu menu entries, %zu subtitles, %zu glyphs, %d failures\\n\",\n                std::size(pt::korean::kMenu), std::size(pt::korean::kSubtitles), font.Glyphs().size(), failures);\n    return failures ? 1 : 0;\n}\n")
          flags = shlex.split(subprocess.check_output(['pkg-config', '--cflags', '--libs', 'harfbuzz'], text=True))
          command = ['clang++', '-std=c++23', '-O2', '-I' + str(root / 'src'),
                     '-I' + str(headers[0].resolve().parent), '-I/opt/homebrew/include',
                     '-DPT_FONT_DIR="' + str(root / 'assets/fonts') + '"',
                     str(probe), str(layout_test), str(root / 'src/engine/ui/text_layout.cpp'), str(root / 'src/engine/ui/ffnt.cpp'),
                     str(root / 'src/engine/ui/unicode_font.cpp'),
                     str(root / 'src/engine/ui/unicode_font_harfbuzz.cpp'),
                     '-o', 'korean-font-probe'] + flags
          subprocess.run(command, check=True)
          subprocess.run([str(Path('korean-font-probe').resolve())], check=True)
      - name: Package and validate unsigned IPA
        run: |
          mkdir -p package/Payload
          ditto --norsrc --noextattr --noqtn source/build/ios-arm64/pt.app package/Payload/PT.app
          (cd package && ditto -c -k --keepParent --norsrc --noextattr --noqtn Payload PT-iPhone-unsigned.ipa)
          python3 - <<'PY'
          import zipfile
          ipa = 'package/PT-iPhone-unsigned.ipa'
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
          assert 'Payload/PT.app/Info.plist' in names, 'IPA is missing Payload/PT.app/Info.plist'
          assert 'Payload/PT.app/fonts/NotoSansKR.ttf' in names, 'IPA is missing the Korean font'
          assert not any(name.startswith('PT.app/') for name in names), 'PT.app must be nested in Payload'
