name: Build P.T. iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [feature/ios-unsigned-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install cmake ninja shaderc molten-vk vulkan-headers harfbuzz pkgconf glm
      - name: Fetch port source
        run: git clone --recurse-submodules --depth 1 https://github.com/buberlo/pt-ipad.git source
      - name: Repair malformed upstream icon patch
        shell: python
        run: |
          from pathlib import Path
          patch = Path('source/patches/0015-app-presentation.patch')
          text = patch.read_text()
          begin = text.index('diff --git a/assets/apple/Assets.xcassets/AppIcon.appiconset/Icon.png')
          end = text.index('diff --git a/assets/apple/Assets.xcassets/Contents.json', begin)
          patch.write_text(text[:begin] + text[end:])
      - name: Reconstruct native source
        run: python3 source/tools/prepare_source.py
      - name: Configure iPhone 18 Pro Max presentation and controls
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil
          root = Path('source/build/port-src')
          def replace(path, old, new):
              text = path.read_text()
              assert old in text, f'Missing expected source in {path}: {old[:80]!r}'
              path.write_text(text.replace(old, new, 1))
          bundle = root / 'cmake/AppleBundle.cmake'
          replace(bundle, 'XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY "2"', 'XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY "1"')
          replace(bundle, '--target-device ipad --app-icon', '--target-device iphone --app-icon')
          plist = root / 'cmake/Info.plist.in'
          replace(plist, '<key>UIDeviceFamily</key><array><integer>2</integer></array>', '<key>UIDeviceFamily</key><array><integer>1</integer></array>')
          replace(plist, '<key>UIApplicationSupportsIndirectInputEvents</key><true/>', '<key>UIApplicationSupportsIndirectInputEvents</key><true/><key>UIRequiresFullScreen</key><true/><key>UISupportedInterfaceOrientations~iphone</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>')
          icon = root / 'assets/apple/Assets.xcassets/AppIcon.appiconset'
          icon.mkdir(parents=True, exist_ok=True)
          # Use the public PC port's stock icon, never a private user icon.
          import urllib.request
          urllib.request.urlretrieve(
              'https://raw.githubusercontent.com/ajellia81-cmd/pt-pc/5ca70171de21db51604002f2335ff72c29fde76f/assets/pt.icns',
              icon / 'PC-Port.icns')
          assert (icon / 'PC-Port.icns').stat().st_size > 1_000_000
          # Korean is a code-side subtitle overlay, matching the port's existing added
          # languages, with a dedicated Noto Sans KR font.
          korean = root / 'src/engine/core/korean_text.h'
          shutil.copyfile('src/engine/core/korean_text.h', korean)
          # Keep the iPhone copy aligned with the reviewed Windows-port Korean UI and
          # subtitle table.  The iOS build only resolves keys it actually displays.
          # Noto Sans SC does not contain Hangul.  A dedicated Korean face prevents
          # repeated missing-glyph fallback during every UI and subtitle draw.
          # Keep the source revision pinned for reproducible IPA builds.
          import urllib.request
          korean_font = root / 'assets/fonts/NotoSansKR.ttf'
          urllib.request.urlretrieve(
              'https://raw.githubusercontent.com/google/fonts/e9678a5385322c63730122ba464765baad83cfd8/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf',
              korean_font)
          urllib.request.urlretrieve(
              'https://raw.githubusercontent.com/google/fonts/e9678a5385322c63730122ba464765baad83cfd8/ofl/notosanskr/OFL.txt',
              root / 'assets/fonts/OFL-NotoSansKR.txt')
          assert korean_font.stat().st_size > 10_000_000, 'Noto Sans KR download is incomplete'
          localized = root / 'src/engine/core/localized_text.h'
          replace(localized, '#include "engine/core/chinese_text.h"', '#include "engine/core/chinese_text.h"\n#include "engine/core/korean_text.h"')
          replace(localized, 'case 10:return russian::Menu(key);case 11:return ukrainian::Menu(key);default:return {};', 'case 10:return russian::Menu(key);case 11:return ukrainian::Menu(key);case 12:return korean::Menu(key);default:return {};')
          replace(localized, 'case 11:add(ukrainian::kMenu,ukrainian::kSubtitles);break;}', 'case 11:add(ukrainian::kMenu,ukrainian::kSubtitles);break;case 12:add(korean::kMenu,korean::kSubtitles);break;}')
          ui_assets_h = root / 'src/game/ui/ui_assets.h'
          replace(ui_assets_h, 'static constexpr int kLanguageCount = 12;', 'static constexpr int kLanguageCount = 13;')
          replace(ui_assets_h, '{"eng", "fra", "deu", "spa", "jpn", "ita", "por", "tur", "zhs", "ara", "rus", "ukr"}', '{"eng", "fra", "deu", "spa", "jpn", "ita", "por", "tur", "zhs", "ara", "rus", "ukr", "kor"}')
          replace(ui_assets_h, 'std::array<std::unique_ptr<UiFont>, 21> fonts_;', 'std::array<std::unique_ptr<UiFont>, 24> fonts_;')
          ui_assets_cpp = root / 'src/game/ui/ui_assets.cpp'
          replace(ui_assets_cpp, 'const char* family = language == 8 ? "Noto Sans SC" : language == 9 ? (type == UiFontType::Movie ? "Noto Naskh Arabic" : "Noto Kufi Arabic") : "Noto Sans";', 'const char* family = language == 8 ? "Noto Sans SC" : language == 12 ? "Noto Sans KR" : language == 9 ? (type == UiFontType::Movie ? "Noto Naskh Arabic" : "Noto Kufi Arabic") : "Noto Sans";')
          options_menu = root / 'src/game/ui/options_menu.cpp'
          replace(options_menu, '"op_sub_chinese", "op_sub_arabic", "op_sub_russian", "op_sub_ukrainian"};', '"op_sub_chinese", "op_sub_arabic", "op_sub_russian", "op_sub_ukrainian", "op_sub_korean"};')
          replace(options_menu, '"Chinese (Simplified)", "Arabic", "Russian", "Ukrainian"};', '"Chinese (Simplified)", "Arabic", "Russian", "Ukrainian", "Korean"};')
          subtitle_player_h = root / 'src/game/ui/subtitle_player.h'
          replace(subtitle_player_h, 'static constexpr int kLanguageCount = 12;', 'static constexpr int kLanguageCount = 13;')
          subtitle_player_cpp = root / 'src/game/ui/subtitle_player.cpp'
          replace(subtitle_player_cpp, '"Ara", "Rus", "Ukr"};', '"Ara", "Rus", "Ukr", "Kor"};')
          save_data = root / 'src/game/save_data.cpp'
          replace(save_data, '    } else if (primary == "uk") {\n        options.subtitle_language = 11;\n    }', '    } else if (primary == "uk") {\n        options.subtitle_language = 11;\n    } else if (primary == "ko") {\n        options.subtitle_language = 12;\n    }')
          subtitles = root / 'src/engine/audio/subtitles.cpp'
          replace(subtitles, 'lang == "Rus" || lang == "Ukr") ? "Eng" : lang;', 'lang == "Rus" || lang == "Ukr" || lang == "Kor") ? "Eng" : lang;')
          replace(subtitles, 'lang == "Ara" ? 9 : lang == "Rus" ? 10 : lang == "Ukr" ? 11 : 0;', 'lang == "Ara" ? 9 : lang == "Rus" ? 10 : lang == "Ukr" ? 11 : lang == "Kor" ? 12 : 0;')
          replace(subtitles, 'case 10:translate(russian::kSubtitles);break;case 11:translate(ukrainian::kSubtitles);break;}', 'case 10:translate(russian::kSubtitles);break;case 11:translate(ukrainian::kSubtitles);break;case 12:translate(korean::kSubtitles);break;}')
          unicode_font = root / 'src/engine/ui/unicode_font_harfbuzz.cpp'
          replace(unicode_font, '    if (family == "Noto Sans SC") return "NotoSansSC.ttf";', '    if (family == "Noto Sans SC") return "NotoSansSC.ttf";\n    if (family == "Noto Sans KR") return "NotoSansKR.ttf";')
          # Resolve the new selector key in every existing UI language.
          korean_names = ['Korean', 'Coréen', 'Koreanisch', 'Coreano', '韓国語', 'Coreano', 'Coreano', 'Korece', '韩国语', 'الكورية', 'Корейский', 'Корейська', '한국어']
          names_cpp = ', '.join('"' + name + '"' for name in korean_names)
          replace(localized, 'inline std::string_view Menu(std::string_view key, int language) {', 'inline std::string_view Menu(std::string_view key, int language) {\n if (key == "op_sub_korean") {\n  static constexpr std::string_view names[] = {' + names_cpp + '};\n  return names[language >= 0 && language < 13 ? language : 0];\n }')
          replace(localized, ' return out;', ' out += std::string(Menu("op_sub_korean", language));\n out += " ff fi fl ffi ffl ";\n return out;')
          assert 'return "NotoSansKR.ttf";' in unicode_font.read_text()
          import subprocess, sys
          fonttools_dir = Path('fonttools-build').resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', '--target', str(fonttools_dir), 'fonttools==4.60.1'], check=True)
          sys.path.insert(0, str(fonttools_dir))
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          variable_font = TTFont(korean_font)
          for weight, filename in [(300, 'NotoSansKR-Light.ttf'), (400, 'NotoSansKR.ttf'), (500, 'NotoSansKR-Medium.ttf')]:
              instance = instantiateVariableFont(variable_font, {'wght': weight}, inplace=False)
              instance.save(korean_font.parent / filename)
          ffnt_h = root / 'src/engine/ui/ffnt.h'
          replace(ffnt_h, "bool LoadUnicodeFont(std::string_view family, std::string_view characters, bool rtl, std::string* error);", "bool LoadUnicodeFont(std::string_view family, std::string_view characters, bool rtl, std::string* error, int weight = 400, bool outline_padding = false);")
          replace(unicode_font, "bool FfntFont::LoadUnicodeFont(std::string_view family, std::string_view characters, bool rtl, std::string* error) {\n    auto fail = [&](const char* text) { if (error) *error = text; return false; };\n    const char* file = FontFile(family);\n    if (!file) return fail(\"bundled font face unavailable\");\n    auto dir = ExecutableDir() / \"fonts\";\n    if (!std::filesystem::is_directory(dir)) dir = PT_FONT_DIR;\n    auto state = std::make_shared<UnicodeFontState>();\n    {\n        std::ifstream in(dir / file, std::ios::binary);\n        if (!in) return fail(\"bundled fonts missing\");\n        state->data.assign(std::istreambuf_iterator<char>(in), {});\n    }\n    if (!stbtt_InitFont(&state->info, state->data.data(), stbtt_GetFontOffsetForIndex(state->data.data(), 0)))\n        return fail(\"Unicode font allocation failed\");\n    state->scale = stbtt_ScaleForMappingEmToPixels(&state->info, float(kEm));\n    int win_ascent = 0, win_descent = 0;\n    if (!WinMetrics(*state, win_ascent, win_descent)) {\n        int a = 0, d = 0, gap = 0;\n        stbtt_GetFontVMetrics(&state->info, &a, &d, &gap);\n        win_ascent = a;\n        win_descent = -d;\n    }\n    state->ascent = int(std::lround(win_ascent * state->scale));\n    const int height = state->ascent + int(std::lround(win_descent * state->scale));\n    state->rtl = rtl;\n    state->blob = hb_blob_create(reinterpret_cast<const char*>(state->data.data()), unsigned(state->data.size()), HB_MEMORY_MODE_READONLY,\n                                 nullptr, nullptr);\n    state->face = hb_face_create(state->blob, 0);\n    state->font = hb_font_create(state->face);\n    const unsigned upem = hb_face_get_upem(state->face);\n    hb_font_set_scale(state->font, int(upem), int(upem));\n\n    std::set<uint32_t> ids;\n    std::vector<std::pair<uint32_t, uint32_t>> codes;\n    const auto decoded = DecodeUtf8(characters);\n    for (auto code : decoded) {\n        if (code > 0xFFFF || code < 32 || code == 0xE000) continue;\n        const int id = stbtt_FindGlyphIndex(&state->info, int(code));\n        if (id == 0) { if (error) *error = \"missing translated character U+\" + std::to_string(code); return false; }\n        codes.emplace_back(code, uint32_t(id));\n        ids.insert(uint32_t(id));\n    }\n    for (const auto& run : VisualRuns(decoded, rtl))\n        for (const auto& g : ShapeRun(*state, std::span<const uint32_t>(decoded).subspan(run.begin, run.end - run.begin), run.rtl)) ids.insert(g.glyph);\n    if (rtl) {\n        for (int i = 0; i < state->info.numGlyphs; ++i) ids.insert(uint32_t(i));\n    }\n    glyphs_.clear(); bitmap_.clear(); composed_.clear(); em_size_ = kEm; pad_ = 0;\n    unicode_line_factor_ = float(height) / float(kEm);\n    for (auto id : ids) {\n        int x0 = 0, y0 = 0, x1 = 0, y1 = 0, advance = 0, bearing = 0;\n        stbtt_GetGlyphBitmapBox(&state->info, int(id), state->scale, state->scale, &x0, &y0, &x1, &y1);\n        stbtt_GetGlyphHMetrics(&state->info, int(id), &advance, &bearing);\n        if (x1 - x0 > 1020 || y1 - y0 > 1020) return fail(\"font glyph too large or unreadable\");\n        FfntGlyph g;\n        g.code = 0x100000 + id;\n        g.width = uint16_t(std::max(0, x1 - x0));\n        g.height = uint16_t(std::max(0, y1 - y0));\n        g.advance = uint16_t(std::clamp<long>(std::lround(advance * state->scale), 0, 65535));\n        g.bearing = int16_t(x0);\n        g.top = int16_t(state->ascent + y0);\n        std::vector<uint8_t> alpha(size_t(g.width) * g.height);\n        if (!alpha.empty()) stbtt_MakeGlyphBitmap(&state->info, alpha.data(), g.width, g.height, g.width, state->scale, state->scale, int(id));\n        composed_[g.code] = alpha;\n        glyphs_.push_back(g);\n        for (auto [code, glyph_id] : codes) {\n            if (glyph_id == id && !composed_.contains(code)) {\n                g.code = code;\n                composed_[code] = alpha;\n                glyphs_.push_back(g);\n            }\n        }\n    }\n    std::sort(glyphs_.begin(), glyphs_.end(), [](auto& a, auto& b) { return a.code < b.code; });\n    unicode_ = std::move(state);\n    return true;\n}\n\n", "bool FfntFont::LoadUnicodeFont(std::string_view family, std::string_view characters, bool rtl, std::string* error, int weight,\n                               bool outline_padding) {\n    auto fail = [&](const char* text) { if (error) *error = text; return false; };\n    const char* file = family == \"Noto Sans KR\" && weight == 300 ? \"NotoSansKR-Light.ttf\" :\n                       family == \"Noto Sans KR\" && weight == 500 ? \"NotoSansKR-Medium.ttf\" : FontFile(family);\n    if (!file) return fail(\"bundled font face unavailable\");\n    auto dir = ExecutableDir() / \"fonts\";\n    if (!std::filesystem::is_directory(dir)) dir = PT_FONT_DIR;\n    auto state = std::make_shared<UnicodeFontState>();\n    {\n        std::ifstream in(dir / file, std::ios::binary);\n        if (!in) return fail(\"bundled fonts missing\");\n        state->data.assign(std::istreambuf_iterator<char>(in), {});\n    }\n    if (!stbtt_InitFont(&state->info, state->data.data(), stbtt_GetFontOffsetForIndex(state->data.data(), 0)))\n        return fail(\"Unicode font allocation failed\");\n    state->scale = stbtt_ScaleForMappingEmToPixels(&state->info, float(kEm));\n    int win_ascent = 0, win_descent = 0;\n    if (!WinMetrics(*state, win_ascent, win_descent)) {\n        int a = 0, d = 0, gap = 0;\n        stbtt_GetFontVMetrics(&state->info, &a, &d, &gap);\n        win_ascent = a;\n        win_descent = -d;\n    }\n    state->ascent = int(std::lround(win_ascent * state->scale));\n    const int height = state->ascent + int(std::lround(win_descent * state->scale));\n    state->rtl = rtl;\n    state->blob = hb_blob_create(reinterpret_cast<const char*>(state->data.data()), unsigned(state->data.size()), HB_MEMORY_MODE_READONLY,\n                                 nullptr, nullptr);\n    state->face = hb_face_create(state->blob, 0);\n    state->font = hb_font_create(state->face);\n    const unsigned upem = hb_face_get_upem(state->face);\n    hb_font_set_scale(state->font, int(upem), int(upem));\n    const hb_variation_t variation{HB_TAG('w', 'g', 'h', 't'), float(weight)};\n    hb_font_set_variations(state->font, &variation, 1);\n\n    std::set<uint32_t> ids;\n    std::vector<std::pair<uint32_t, uint32_t>> codes;\n    const auto decoded = DecodeUtf8(characters);\n    for (auto code : decoded) {\n        if (code > 0xFFFF || code < 32 || code == 0xE000) continue;\n        const int id = stbtt_FindGlyphIndex(&state->info, int(code));\n        if (id == 0) { if (error) *error = \"missing translated character U+\" + std::to_string(code); return false; }\n        codes.emplace_back(code, uint32_t(id));\n        ids.insert(uint32_t(id));\n    }\n    for (const auto& run : VisualRuns(decoded, rtl))\n        for (const auto& g : ShapeRun(*state, std::span<const uint32_t>(decoded).subspan(run.begin, run.end - run.begin), run.rtl)) ids.insert(g.glyph);\n    if (rtl) {\n        for (int i = 0; i < state->info.numGlyphs; ++i) ids.insert(uint32_t(i));\n    }\n    glyphs_.clear(); bitmap_.clear(); composed_.clear(); em_size_ = kEm; pad_ = 0;\n    unicode_line_factor_ = float(height) / float(kEm);\n    for (auto id : ids) {\n        int x0 = 0, y0 = 0, x1 = 0, y1 = 0, advance = 0, bearing = 0;\n        stbtt_GetGlyphBitmapBox(&state->info, int(id), state->scale, state->scale, &x0, &y0, &x1, &y1);\n        stbtt_GetGlyphHMetrics(&state->info, int(id), &advance, &bearing);\n        constexpr int kOutlinePadding = 2;\n        const int raw_width = std::max(0, x1 - x0), raw_height = std::max(0, y1 - y0);\n        const int max_box = outline_padding ? 1016 : 1020;\n        if (raw_width > max_box || raw_height > max_box) return fail(\"font glyph too large or unreadable\");\n        const int padding = outline_padding && raw_width && raw_height ? kOutlinePadding : 0;\n        FfntGlyph g;\n        g.code = 0x100000 + id;\n        g.width = uint16_t(raw_width + padding * 2);\n        g.height = uint16_t(raw_height + padding * 2);\n        g.advance = uint16_t(std::clamp<long>(std::lround(advance * state->scale), 0, 65535));\n        g.bearing = int16_t(x0 - padding);\n        g.top = int16_t(state->ascent + y0 - padding);\n        std::vector<uint8_t> alpha(size_t(g.width) * g.height);\n        if (raw_width && raw_height) stbtt_MakeGlyphBitmap(&state->info, alpha.data() + size_t(padding) * g.width + padding,\n                                                            raw_width, raw_height, g.width, state->scale, state->scale, int(id));\n        composed_[g.code] = alpha;\n        glyphs_.push_back(g);\n        for (auto [code, glyph_id] : codes) {\n            if (glyph_id == id && !composed_.contains(code)) {\n                g.code = code;\n                composed_[code] = alpha;\n                glyphs_.push_back(g);\n            }\n        }\n    }\n    std::sort(glyphs_.begin(), glyphs_.end(), [](auto& a, auto& b) { return a.code < b.code; });\n    unicode_ = std::move(state);\n    return true;\n}\n\n")
          unicode_win = root / 'src/engine/ui/unicode_font.cpp'
          replace(unicode_win, "bool FfntFont::LoadUnicodeFont(std::string_view family, std::string_view characters, bool rtl, std::string* error) {", "bool FfntFont::LoadUnicodeFont(std::string_view family, std::string_view characters, bool rtl, std::string* error, int weight, bool outline_padding) {")
          replace(ui_assets_cpp, "if (!font.font.LoadUnicodeFont(family, localized::Characters(language), language == 9, &error)) {", "if (!font.font.LoadUnicodeFont(family, localized::Characters(language), language == 9, &error,\n                                           language == 12 ? (type == UiFontType::Movie ? 300 : 500) : 400,\n                                           language == 12 && type == UiFontType::Movie)) {")
          uif_view = root / 'src/game/ui/uif_view.cpp'
          replace(uif_view, "            const UifInlinePicture* picture =", "            // Match the reviewed Windows Korean UI cap height.\n            if (font_language == 12 && type != UiFontType::Movie) {\n                constexpr float kKoreanUiScale = .80f;\n                text_style.font_width *= kKoreanUiScale;\n                text_style.font_height *= kKoreanUiScale;\n                text_style.text_space *= kKoreanUiScale;\n                text_style.line_space *= kKoreanUiScale;\n            }\n            const UifInlinePicture* picture =")
          text_layout = root / 'src/engine/ui/text_layout.cpp'
          replace(text_layout, "return (c >= 0x2E80 && c <= 0x9FFF)", "return (c >= 0x1100 && c <= 0x11FF) || (c >= 0xAC00 && c <= 0xD7AF) || (c >= 0x2E80 && c <= 0x9FFF)")
          replace(subtitles, "if (!found) { if (error) *error = std::format(\"{} subtitle {:08x} missing or line count differs\", lang, entry.key); return false; }", "if (!found) { LogWarn(\"subtitles: {} subtitle {:08x} is untranslated or has a different line count; retaining English\", lang, entry.key); }")
          replace(subtitle_player_cpp, "#include \"engine/core/log.h\"", "#include \"engine/core/log.h\"\n#include \"engine/core/korean_text.h\"")
          replace(subtitle_player_cpp, "\n}\n\nint SubtitlePlayer::PlayingPriority", "\n// SubtitleTable normally replaces English lines while it loads the selected\n// language.  Keep a display-time Korean lookup too: it is deliberately\n// independent of package parsing so an older or modded English subtitle\n// package cannot silently turn a Korean selection back into English.\nstd::string KoreanLine(uint32_t key, size_t line, size_t expected_lines, std::string_view fallback) {\n    for (const korean::Subtitle& subtitle : korean::kSubtitles) {\n        // A translation can use a different number of on-screen cues than a\n        // source package.  Never shift every later cue by applying such a\n        // table by index; SubtitleTable keeps the source line in that case.\n        if (subtitle.key != key || subtitle.lines.size() != expected_lines || line >= subtitle.lines.size()) continue;\n        std::string text(subtitle.lines.begin()[line]);\n        std::replace(text.begin(), text.end(), '|', '\\n');\n        return text;\n    }\n    return std::string(fallback);\n}\n\n}\n\nint SubtitlePlayer::PlayingPriority")
          replace(subtitle_player_cpp, "            out.text = ValidUtf8(line.text) ? line.text : Cp1252ToUtf8(line.text);", "            const size_t korean_line = static_cast<size_t>(&line - entry->lines.data());\n            const std::string source_text = ValidUtf8(line.text) ? line.text : Cp1252ToUtf8(line.text);\n            out.text = language_ == 12 ? KoreanLine(best->key, korean_line, entry->lines.size(), source_text) : source_text;")
          replace(ui_assets_h, '    UiFont* Font(UiFontType type, int language);', '    UiFont* Font(UiFontType type, int language);\n    UiFont* FontCovering(UiFontType type, int language, std::string_view text);')
          replace(ui_assets_h, '    std::vector<UiFontStyle> styles_;', '    std::map<std::pair<int, int>, std::unique_ptr<UiFont>> covering_fonts_;\n    std::vector<UiFontStyle> styles_;')
          replace(ui_assets_cpp, 'const UiFontStyle* UiAssets::FontStyle(std::string_view name, int language) const {', "namespace {\n\nstd::vector<uint32_t> CodePoints(std::string_view text) {\n    std::vector<uint32_t> out;\n    for (size_t i = 0; i < text.size();) {\n        const unsigned char c = static_cast<unsigned char>(text[i]);\n        uint32_t code = c;\n        size_t n = 1;\n        if (c >= 0xF0) { code = c & 0x07; n = 4; }\n        else if (c >= 0xE0) { code = c & 0x0F; n = 3; }\n        else if (c >= 0xC0) { code = c & 0x1F; n = 2; }\n        for (size_t k = 1; k < n && i + k < text.size(); ++k) code = (code << 6) | (static_cast<unsigned char>(text[i + k]) & 0x3F);\n        i += n;\n        if (code >= 32) out.push_back(code);\n    }\n    return out;\n}\n\n}\n\nUiFont* UiAssets::FontCovering(UiFontType type, int language, std::string_view text) {\n    UiFont* base = Font(type, language);\n    if (!base) return nullptr;\n    const std::vector<uint32_t> codes = CodePoints(text);\n    bool missing = false;\n    for (uint32_t code : codes) missing = missing || (code != 0x20 && code != 0x3000 && !base->font.Find(code));\n    if (!missing) return base;\n    const std::pair<int, int> key(static_cast<int>(type), language);\n    if (auto it = covering_fonts_.find(key); it != covering_fonts_.end()) return it->second && it->second->ready ? it->second.get() : base;\n    auto made = std::make_unique<UiFont>();\n    const int file_index = language >= 7 ? (type == UiFontType::Movie ? 2 : 0) : (static_cast<int>(type) * 2 + (language == kJapanese ? 1 : 0)) % 4;\n    auto data = vfs_->ReadFile(kFontFiles[file_index]);\n    std::string error;\n    const char* family = language == 8 || language == kJapanese ? \"Noto Sans SC\"\n                         : language == 12                        ? \"Noto Sans KR\"\n                         : language == 9                         ? (type == UiFontType::Movie ? \"Noto Naskh Arabic\" : \"Noto Kufi Arabic\")\n                                                                 : \"Noto Sans\";\n    const int weight = language == 12 ? (type == UiFontType::Movie ? 300 : 500) : 400;\n    if (!data || !made->font.Parse(*data, &error) ||\n        !made->font.LoadUnicodeFont(family, localized::Characters(language) + std::string(text), language == 9, &error, weight,\n                                    language == 12 && type == UiFontType::Movie)) {\n        LogError(\"ui: a font covering the text in language {} ({}): {}\", language, family, error);\n        covering_fonts_[key] = nullptr;\n        return base;\n    }\n    made->crisp = type == UiFontType::PcSystem;\n    std::vector<std::vector<uint8_t>> mips;\n    made->font.BuildAtlas(mips, made->crisp ? 3 : 1, !made->crisp);\n    std::vector<TextureMip> texture_mips;\n    uint32_t w = made->font.AtlasWidth(), h = made->font.AtlasHeight();\n    for (const auto& mip : mips) {\n        texture_mips.push_back({w, h, mip});\n        w = std::max(1u, w / 2);\n        h = std::max(1u, h / 2);\n    }\n    made->atlas = textures_->Create(std::format(\"ui:font:covering:{}:{}\", static_cast<int>(type), language), VK_FORMAT_R8_UNORM, texture_mips);\n    if (made->atlas == TextureManager::kWhite) {\n        LogWarn(\"ui: a font covering the text in language {}: no video memory for its atlas\", language);\n        return base;\n    }\n    made->ready = true;\n    LogInfo(\"ui: font {} covering the port's text in language {} ({} glyphs, atlas {}x{})\", family, language, made->font.Glyphs().size(),\n            made->font.AtlasWidth(), made->font.AtlasHeight());\n    UiFont* out = made.get();\n    covering_fonts_[key] = std::move(made);\n    return out;\n}\n\nconst UiFontStyle* UiAssets::FontStyle(std::string_view name, int language) const {")
          replace(uif_view, 'UiFont* font = assets_->Font(type, font_language);', 'UiFont* font = assets_->FontCovering(type, font_language, *state.text);')
          replace(unicode_font, '    if (family == "Noto Sans") return "NotoSans.ttf";', '    if (family == "Noto Sans") return "NotoSans.ttf";\n    if (family == "Noto Kufi Arabic") return "NotoKufiArabic.ttf";\n    if (family == "Noto Naskh Arabic") return "NotoNaskhArabic.ttf";')
          main = root / 'src/main.cpp'
          replace(main, 'void ApplyFullscreen(App& app) {\n    if (!app.window) {\n        return;\n    }\n    const int mode = app.settings.display.fullscreen;\n    if (mode == 2) {\n        if (const SDL_DisplayMode* desktop = SDL_GetDesktopDisplayMode(SDL_GetDisplayForWindow(app.window))) {\n            SDL_SetWindowFullscreenMode(app.window, desktop);\n        }\n    } else {\n        SDL_SetWindowFullscreenMode(app.window, nullptr);\n    }\n    SDL_SetWindowFullscreen(app.window, mode != 0);\n}', 'void ApplyFullscreen(App& app) {\n    if (!app.window) {\n        return;\n    }\n#if PT_IOS\n    const bool fullscreen = app.settings.display.fullscreen != 0;\n    SDL_SetWindowFullscreenMode(app.window, nullptr);\n    SDL_SetWindowFullscreen(app.window, fullscreen);\n    if (fullscreen) {\n        int width = 0, height = 0;\n        if (SDL_GetWindowSizeInPixels(app.window, &width, &height) && width > 0 && height > 0) {\n            app.options.width = static_cast<uint32_t>(width);\n            app.options.height = static_cast<uint32_t>(height);\n            app.renderer.SetRenderExtent({app.options.width, app.options.height});\n        }\n    } else {\n        app.renderer.SetRenderExtent({1920, 1080});\n    }\n    return;\n#else\n    const int mode = app.settings.display.fullscreen;\n    if (mode == 2) {\n        if (const SDL_DisplayMode* desktop = SDL_GetDesktopDisplayMode(SDL_GetDisplayForWindow(app.window))) {\n            SDL_SetWindowFullscreenMode(app.window, desktop);\n        }\n    } else {\n        SDL_SetWindowFullscreenMode(app.window, nullptr);\n    }\n    SDL_SetWindowFullscreen(app.window, mode != 0);\n#endif\n}')
          replace(main, '        app.settings.display.fullscreen = 1;\n', '')
          replace(main, '        app.settings.display.mute_in_background = true;\n        app.settings.graphics.enhanced_textures = false;\n        app.settings.vr.enabled = false;', '        app.settings.display.mute_in_background = true;\n        app.settings.vr.enabled = false;')
          replace(main, 'app.window = SDL_CreateWindow("P.T.", app.settings.display.width, app.settings.display.height,\n                                      SDL_WINDOW_VULKAN | SDL_WINDOW_RESIZABLE | SDL_WINDOW_HIGH_PIXEL_DENSITY);', '#if PT_IOS\n        constexpr SDL_WindowFlags window_flags = SDL_WINDOW_VULKAN | SDL_WINDOW_HIGH_PIXEL_DENSITY | SDL_WINDOW_BORDERLESS;\n#else\n        constexpr SDL_WindowFlags window_flags = SDL_WINDOW_VULKAN | SDL_WINDOW_RESIZABLE | SDL_WINDOW_HIGH_PIXEL_DENSITY;\n#endif\n        app.window = SDL_CreateWindow("P.T.", app.settings.display.width, app.settings.display.height, window_flags);')
          replace(main, '        ApplyFullscreen(app);\n    }\n    MountMods(app);', '        ApplyFullscreen(app);\n#if PT_IOS\n        int pixel_width = 0, pixel_height = 0;\n        if (SDL_GetWindowSizeInPixels(app.window, &pixel_width, &pixel_height) && pixel_width > 0 && pixel_height > 0) {\n            app.options.width = static_cast<uint32_t>(pixel_width);\n            app.options.height = static_cast<uint32_t>(pixel_height);\n            pt::LogInfo("iPhone display: {}x{} points, {}x{} pixels", app.settings.display.width, app.settings.display.height, pixel_width, pixel_height);\n        }\n#endif\n    }\n    MountMods(app);')
          replace(main, '#if PT_IOS\n        input.SetTouchMenu(ui_ready && ui.MenuOpen());', '#if PT_IOS\n        const bool ios_gamepad_connected = input.GamepadCount() != 0;\n        input.EnableTouch(!ios_gamepad_connected);\n        input.SetTouchMenu(!ios_gamepad_connected && ui_ready && ui.MenuOpen());')
          text = main.read_text()
          text, count = re.subn(r'#if PT_IOS\n(\s*)\{\n(\s*)const ImVec2 size = ImGui::GetIO\(\).DisplaySize;', r'#if PT_IOS\n\1if (input.GamepadCount() == 0) {\n\2const ImVec2 size = ImGui::GetIO().DisplaySize;', text, count=1)
          assert count == 1, 'Could not guard the virtual control overlay'
